[project]
name = "calligraphy-studio-api"
version = "0.1.0"
description = "Glyph store and project API for Calligraphy Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "Pillow==11.3.0",
  "lmdb==2.3.0",
  "numpy==2.4.6",
  "fonttools==4.66.0",
  "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
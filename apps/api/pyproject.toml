[project]
name = "calligraphy-studio-api"
version = "0.7.1"
description = "Glyph store and project API for Calligraphy Studio"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.135.4",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.31",
  "Pillow==12.3.0",
  "lmdb==2.3.0",
  "numpy==2.3.1",
  "fonttools==4.65.0",
  "httpx==0.28.1",
  "uharfbuzz==0.56.2",
  "freetype-py==2.5.1",
  "brotli==1.2.0",
  "regex==2026.9.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

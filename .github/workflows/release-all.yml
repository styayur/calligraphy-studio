name: Release Windows and Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.4.0

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - name: Build offline web bundle
        working-directory: apps/web
        run: |
          npm ci
          npm run build:desktop
      - name: Build Electron installer and portable exe
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:win
      - name: Generate checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows | Out-Null
          Copy-Item apps/desktop/release/*.exe release/windows/
          $lines = Get-ChildItem release/windows/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 release/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/windows/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets and sync Capacitor
        working-directory: apps/web
        run: |
          npm ci
          npm run build:android
          npx cap sync android
      - name: Build installable preview APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Prepare APK and checksum
        shell: bash
        run: |
          mkdir -p release/android
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk release/android/CalligraphyStudio-Android-0.4.0.apk
          cd release/android
          sha256sum CalligraphyStudio-Android-0.4.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/android/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-artifacts/windows-release/*.exe release-artifacts/android-release/*.apk --clobber
          else
            gh release create "$TAG" release-artifacts/windows-release/*.exe release-artifacts/android-release/*.apk               --title "Calligraphy Studio $TAG"               --notes-file release/RELEASE_NOTES.md
          fi
      - name: Commit checksums and release metadata
        run: |
          cp release-artifacts/windows-release/SHA256SUMS.txt release/windows/SHA256SUMS.txt
          cp release-artifacts/android-release/SHA256SUMS.txt release/android/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/windows/SHA256SUMS.txt release/android/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update v0.4.0 release checksums"
            git push
          fi

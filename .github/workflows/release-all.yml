name: Release Windows, Android and Web

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        default: v0.5.0

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag and application versions
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          VERSION="${TAG#v}"
          test "$(node -p "require('./apps/web/package.json').version")" = "$VERSION"
          test "$(node -p "require('./apps/desktop/package.json').version")" = "$VERSION"
          grep -F "versionName \"$VERSION\"" apps/web/android/app/build.gradle
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json
      - name: Build offline web bundle
        working-directory: apps/web
        run: |
          npm ci
          npm run build:desktop
      - name: Build installer and portable executable
        working-directory: apps/desktop
        run: |
          npm ci
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Build web assets and sync plugins
        working-directory: apps/web
        run: |
          npm ci
          npm run build:android
          npx cap sync android
      - name: Build preview APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Prepare APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk "release-artifacts/CalligraphyStudio-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk
          if-no-files-found: error

  web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable web bundle
        working-directory: apps/web
        run: |
          npm ci
          npm run build:desktop
      - name: Browser regression tests
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          python -m http.server 5178 --directory apps/web/dist > /tmp/calligraphy-http.log 2>&1 &
          python scripts/test_studio_browser.py --url http://127.0.0.1:5178
      - name: Package web bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp release/WEB_README.md apps/web/dist/README.md
          cp LICENSE apps/web/dist/LICENSE
          cp third_party/NOTICE.md apps/web/dist/THIRD_PARTY_NOTICE.md
          cd apps/web/dist
          zip -qr "../../../CalligraphyStudio-Web-$VERSION.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: CalligraphyStudio-Web-*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, windows, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Calculate checksums
        working-directory: release-artifacts
        run: sha256sum *.exe *.apk *.zip > SHA256SUMS.txt
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Calligraphy Studio $TAG" --notes-file release/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release-artifacts/* --clobber
          gh release edit "$TAG" --draft=false --latest --notes-file release/RELEASE_NOTES.md

name: Bug report
description: Report a reproducible Calligraphy Studio problem.
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.6.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows installer
        - Windows portable
        - Android
        - Web bundle
        - Source/local API
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and browser/runtime version
      placeholder: Windows 11; Edge 141 / Android 14 / Node 22
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the exact text, font/asset, layout settings, or imported project needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or logs
      description: Remove private documents, personal text, local paths, and credentials.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private documents, personal text, credentials, and local paths.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
